    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f2eb;
    }

    [hidden] { display: none !important; }

    .bd-hero {
      position: relative;
      isolation: isolate;
      min-height: 620px;
      padding: 105px clamp(24px, 7vw, 110px) 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 40px;
      color: white;
      background:
        linear-gradient(rgba(7, 19, 27, .65), rgba(7, 19, 27, .65)),
        url("back.jpeg") center / cover no-repeat,
        #101a22;
    }

    .bd-hero::before {
      content: "";
      position: absolute;
      inset: 18px;
      border: 1px solid rgba(242, 174, 44, .22);
      pointer-events: none;
      z-index: -1;
    }

    .bd-hero__content {
      position: relative;
      z-index: 1;
      max-width: 680px;
    }

    .bd-hero__label {
      display: inline-block;
      padding: 9px 15px;
      border: 1px solid rgba(255, 190, 64, .55);
      border-radius: 30px;
      color: #ffc45b;
      font-size: 13px;
      letter-spacing: 2px;
    }

    .bd-hero h1 {
      margin: 25px 0 18px;
      font-size: clamp(36px, 5.5vw, 72px);
      line-height: 1.25;
    }

    .bd-hero h1 em {
      font-style: normal;
      color: #f7ae2c;
    }

    .bd-hero__actions { margin-top: 32px; }

    .bd-hero__primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 50px;
      padding: 12px 23px;
      border-radius: 9px;
      background: #f5a623;
      color: #17212a;
      font-weight: bold;
      text-decoration: none;
    }

    .bd-hero__note { margin-top: 35px; }

    .bd-hero__mark {
      flex: 0 0 280px;
      width: 280px;
      height: 280px;
      border: 2px solid rgba(247, 174, 44, .5);
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 0 90px rgba(245, 166, 35, .13);
    }

    .bd-hero__mark img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    /* بوتونێ زمانان */
    .site-topbar {
      position: absolute;
      top: 24px;
      right: clamp(24px, 7vw, 110px);
      z-index: 3;
    }

    .language-switch {
      display: inline-flex;
      gap: 3px;
      padding: 4px;
      border: 1px solid rgba(255, 190, 64, .65);
      border-radius: 999px;
      background: rgba(16, 26, 34, .82);
    }

    .language-switch button {
      border: 0;
      border-radius: 999px;
      padding: 6px 12px;
      background: transparent;
      color: white;
      font: 600 13px Tahoma, Arial, sans-serif;
      cursor: pointer;
    }

    .language-switch button[aria-pressed="true"] {
      background: #f5a623;
      color: #17212a;
    }

    .language-switch button:focus-visible,
    .catalog-card:focus-visible,
    .product-dialog button:focus-visible {
      outline: 2px solid #f5a623;
      outline-offset: 3px;
    }

    /* لینکێن سۆشیال */
    .social {
      display: inline-block;
      margin: 5px;
      padding: 12px 24px;
      border-radius: 10px;
      color: white;
      font-weight: bold;
      text-decoration: none;
      text-align: center;
    }

    .social:hover { filter: brightness(1.15); }
    .whatsapp { background: #25d366; }
    .instagram {
      background: linear-gradient(45deg, #feda75, #fa7e1e, #d62976, #962fbf);
    }
    .facebook { background: #1877f2; }
    .tiktok { background: #111; }
    .snapchat { background: #f39c12; }

    /* جۆرێن بەرهەمان */
    .catalog {
      max-width: 1200px;
      margin: auto;
      padding: 55px 22px 80px;
      color: #17222b;
    }

    .catalog h2 {
      margin: 0 0 12px;
      font-size: clamp(27px, 4vw, 42px);
    }

    .catalog-intro {
      margin: 0 0 27px;
      color: #58636b;
      line-height: 1.8;
    }

    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .catalog-card {
      display: block;
      width: 100%;
      padding: 0;
      overflow: hidden;
      text-align: start;
      border: 1px solid #e8e1d3;
      border-radius: 17px;
      background: white;
      box-shadow: 0 10px 25px #17222b16;
      cursor: pointer;
      font: inherit;
      color: inherit;
      transition: transform .2s, box-shadow .2s;
    }

    .catalog-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 17px 30px #17222b26;
    }

    .catalog-art {
      position: relative;
      height: 165px;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: linear-gradient(135deg, var(--accent), #14212b);
      color: white;
      font-size: 65px;
    }

    .catalog-art img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .catalog-card__body {
      display: block;
      padding: 18px;
    }

    .catalog-card__name {
      display: block;
      font-size: 21px;
      font-weight: bold;
    }

    .catalog-card__hint {
      display: block;
      margin-top: 8px;
      color: #657078;
      font-size: 14px;
    }

    .catalog-card__bar {
      display: block;
      height: 5px;
      background: var(--accent);
    }

    .catalog-back {
      margin-bottom: 22px;
      padding: 9px 16px;
      border: 1px solid #b18b43;
      border-radius: 9px;
      background: transparent;
      color: #17222b;
      font: inherit;
      cursor: pointer;
    }

    /* پەنجەرەیا وێنەیان */
    .product-dialog {
      width: min(850px, calc(100% - 32px));
      max-height: calc(100vh - 32px);
      padding: 28px;
      border: 0;
      border-radius: 18px;
      background: white;
      color: #17222b;
      font: inherit;
    }

    .product-dialog::backdrop {
      background: rgba(7, 19, 27, .78);
    }

    .product-dialog h2 {
      margin: 0 0 20px;
      padding-left: 42px;
    }

    .product-dialog__close {
      position: absolute;
      top: 12px;
      left: 16px;
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 50%;
      background: #eee;
      font-size: 26px;
      cursor: pointer;
    }

    .product-dialog__gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr));
      gap: 14px;
    }

    .product-dialog__gallery img {
      display: block;
      width: 100%;
      max-height: 65vh;
      object-fit: contain;
      border-radius: 12px;
      background: #f5f2eb;
    }

    @media (max-width: 700px) {
      .bd-hero {
        min-height: auto;
        padding: 105px 28px 75px;
      }

      .bd-hero__mark { display: none; }

      .site-topbar {
        top: 16px;
        right: 20px;
      }

      .bd-hero__primary { width: 100%; }
    }

    @media (max-width: 600px) {
      .catalog { padding: 38px 16px 60px; }

      .catalog-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .catalog-art {
        height: 125px;
        font-size: 48px;
      }

      .catalog-card__name { font-size: 17px; }
    }
  </style>
</head>

    let currentLang = "ku";

    const catalog = document.getElementById("products");
    const categoryView = document.getElementById("categoryView");
    const itemView = document.getElementById("itemView");
    const categoryGrid = document.getElementById("categoryGrid");
    const itemGrid = document.getElementById("itemGrid");
    const productDialog = document.getElementById("productDialog");
    const productGallery = document.getElementById("productGallery");

    function displayName(entry) {
      if (currentLang === "en") return entry.nameEn || entry.name;
      return currentLang === "ar" ? (entry.nameAr || entry.name) : entry.name;
    }

    function showProduct(product) {
      document.getElementById("productDialogTitle").textContent =
        displayName(product);

      productGallery.replaceChildren();

      const pictures = product.images ||
        (product.image ? [product.image] : []);

      pictures.forEach(source => {
        const picture = document.createElement("img");
        picture.src = source;
        picture.alt = displayName(product);

        picture.onerror = () => {
          const note = document.createElement("p");
          note.textContent = labels[currentLang].missing + source;
          picture.replaceWith(note);
        };

        productGallery.appendChild(picture);
      });

      productDialog.showModal();
    }

    document.getElementById("closeProductDialog")
      .addEventListener("click", () => productDialog.close());

    productDialog.addEventListener("click", event => {
      if (event.target === productDialog) productDialog.close();
    });

    function makeCard(entry, color, hint, onClick) {
      const card = document.createElement("button");
      card.type = "button";
      card.className = "catalog-card";
      card.style.setProperty("--accent", color);

      const art = document.createElement("span");
      art.className = "catalog-art";
      art.textContent = entry.icon || "✦";

      if (entry.image) {
        const img = document.createElement("img");
        img.src = entry.image;
        img.alt = "";
        img.loading = "lazy";
        img.onerror = () => img.remove();
        art.appendChild(img);
      }

      const body = document.createElement("span");
      body.className = "catalog-card__body";

      const name = document.createElement("span");
      name.className = "catalog-card__name";
      name.textContent = displayName(entry);

      const sub = document.createElement("span");
      sub.className = "catalog-card__hint";
      sub.textContent = hint;

      body.append(name, sub);

      const bar = document.createElement("span");
      bar.className = "catalog-card__bar";

      card.append(art, body, bar);
      card.addEventListener("click", onClick);

      return card;
    }

    // هەر بابەتەک products هەبیت، بابەتێن دی ڤەدکەت؛ یێ دوماهیکێ وێنەیان ڤەدکەت.
    const catalogPath = [];
    const backButton = document.getElementById("backToCategories");

    function hasProducts(entry) {
      return Array.isArray(entry.products) && entry.products.length > 0;
    }

    function renderCatalog() {
      const parent = catalogPath[catalogPath.length - 1];
      const grid = parent ? itemGrid : categoryGrid;
      const entries = parent ? parent.products : categories;
      const inheritedColor = [...catalogPath].reverse().find(entry => entry.color)?.color || "#2d6c9d";
      grid.replaceChildren();
      entries.forEach(entry => {
        grid.appendChild(makeCard(
          entry,
          entry.color || inheritedColor,
          hasProducts(entry) ? labels[currentLang].viewItems : labels[currentLang].viewPhotos,
          () => {
            if (hasProducts(entry)) {
              catalogPath.push(entry);
              renderCatalog();
              catalog.scrollIntoView({ behavior: "smooth" });
              backButton.focus({ preventScroll: true });
            } else {
              showProduct(entry);
            }
          }
        ));
      });
      categoryView.hidden = Boolean(parent);
      itemView.hidden = !parent;
      if (parent) {
        document.getElementById("itemHeading").textContent = displayName(parent);
        const previous = catalogPath[catalogPath.length - 2];
        backButton.textContent = previous
          ? labels[currentLang].backTo + displayName(previous)
          : labels[currentLang].back;
      }
    }

    function setLanguage(lang) {
      if (!labels[lang]) return;
      currentLang = lang;
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === "en" ? "ltr" : "rtl";
      document.querySelectorAll("[data-i18n-aria]").forEach(element => {
        element.setAttribute("aria-label", labels[lang][element.dataset.i18nAria]);
      });

      document.querySelectorAll("[data-i18n]").forEach(element => {
        element.textContent = labels[lang][element.dataset.i18n];
      });

      document.querySelectorAll("[data-i18n-html]").forEach(element => {
        element.innerHTML = labels[lang][element.dataset.i18nHtml];
      });

      document.querySelectorAll("[data-lang]").forEach(button => {
        button.setAttribute(
          "aria-pressed",
          String(button.dataset.lang === lang)
        );
      });

      if (productDialog.open) productDialog.close();
      renderCatalog();
    }

    document.querySelectorAll("[data-lang]").forEach(button => {
      button.addEventListener("click", () => {
        setLanguage(button.dataset.lang);
      });
    });

    document.getElementById("showCategories")
      .addEventListener("click", event => {
        event.preventDefault();
        catalog.hidden = false;
        catalogPath.length = 0;
        renderCatalog();
        catalog.scrollIntoView({ behavior: "smooth" });
      });

    document.getElementById("backToCategories")
      .addEventListener("click", () => {
        const previousEntry = catalogPath.pop();
        renderCatalog();
        catalog.scrollIntoView({ behavior: "smooth" });
        const grid = catalogPath.length ? itemGrid : categoryGrid;
        const entries = catalogPath.length ? catalogPath[catalogPath.length - 1].products : categories;
        const index = entries.indexOf(previousEntry);
        if (index >= 0) grid.children[index].focus({ preventScroll: true });
      });

    setLanguage("ku");
